<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran</title>
</head>
<body>

    <h2>Pilih Metode Pembayaran</h2>

    <form action="proses.html">

        <input type="radio" name="pembayaran" value="transfer" required>
        Transfer Bank
        <br><br>

        <input type="radio" name="pembayaran" value="qris">
        QRIS
        <br><br>

        <input type="radio" name="pembayaran" value="cod">
        Bayar di Tempat (COD)
        <br><br>

        <input type="radio" name="pembayaran" value="ewallet">
        E-Wallet (DANA, OVO, GoPay)
        <br><br>

        <button type="submit">Lanjutkan</button>

    </form>

</body>
</html>
</html>
