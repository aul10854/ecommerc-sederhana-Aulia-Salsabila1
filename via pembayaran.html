<style>
    body {
        background: linear-gradient(135deg, #ffb6d5, #ff69b4);
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    .box {
        text-align: center;
        background: white;
        padding: 60px;
        border-radius: 20px;
        width: 600px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        transition: 0.3s ease;
    }

    .box:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }

    h2 {
        font-size: 38px;
        margin-bottom: 30px;
        color: #d63384;
        font-weight: bold;
    }

    input {
        transform: scale(1.5);
        margin-right: 15px;
        accent-color: hotpink;
    }

    .option {
        text-align: left;
        margin: 15px 0;
        padding: 18px;
        border-radius: 12px;
        transition: 0.2s;
        font-size: 24px;
        font-weight: bold;
        cursor: pointer;
    }

    .option:hover {
        background: #ffe4f1;
    }

    button {
        padding: 16px 40px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        background: linear-gradient(135deg, #ff4da6, #ff1493);
        color: white;
        font-size: 24px;
        font-weight: bold;
        margin-top: 30px;
        transition: 0.2s ease;
        box-shadow: 0 8px 18px rgba(255,20,147,0.3);
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 25px rgba(255,20,147,0.4);
    }

    button:active {
        transform: scale(0.95);
    }
</style>
