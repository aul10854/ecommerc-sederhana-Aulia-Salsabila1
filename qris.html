 <style>
    body {
        background-color: pink;
        font-family: Arial, sans-serif;

        height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        text-align: center;
        background: white;
        padding: 45px;
        border-radius: 20px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        width: 450px;
    }

    h2 {
        font-size: 32px;
        color: #d63384;
        margin-bottom: 20px;
    }

    img {
        width: 320px; /* dibesarin */
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        margin-bottom: 15px;
    }

    p {
        font-size: 19px;
        margin-bottom: 20px;
    }

    button {
        padding: 14px 28px;
        border: none;
        border-radius: 18px;
        background: hotpink;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button:hover {
        transform: scale(1.05);
        background: #ff1493;
    }

    button:active {
        transform: scale(0.95);
    }
</style>

<div class="box">

    <h2>Pembayaran QRIS</h2>

    <img src="qris.jpeg">

    <p>Silakan scan QRIS di atas untuk melakukan pembayaran.</p>
