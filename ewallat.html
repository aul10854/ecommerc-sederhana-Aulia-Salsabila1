<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran E-Wallet</title>
</head>
<body>

    <h2>Pembayaran E-Wallet</h2>

    <p>Pilih E-Wallet yang ingin digunakan.</p>

    <form>

        <input type="radio" name="ewallet" required>
        DANA
        <br><br>

        <input type="radio" name="ewallet">
        OVO
        <br><br>

        <input type="radio" name="ewallet">
        GoPay
        <br><br>

        <input type="radio" name="ewallet">
        ShopeePay
        <br><br>

        <label>Nomor HP E-Wallet:</label><br>
        <input type="tel" placeholder="08xxxxxxxxxx" required>
        <br><br>

        <button type="submit">Bayar</button>

    </form>

    <br>
    <a href="pembayaran.html">Kembali</a>

</body>
</html>
