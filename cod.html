
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran COD</title>

    <style>
        body{
            background-color:#FFC0CB;
            font-family:Arial, sans-serif;
            margin:0;
            padding:0;
        }

        .container{
            width:400px;
            margin:50px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#6A0DAD;
        }

        p{
            text-align:center;
        }

        label{
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .btn-pesan{
            background:#6A0DAD;
            color:white;
        }

        .btn-pesan:hover{
            background:#4B0082;
        }

        .btn-kembali{
            background:gray;
            color:white;
            margin-top:10px;
        }

        .btn-kembali:hover{
            background:#555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🚚 Pembayaran COD</h2>

    <p>Silakan isi data penerima di bawah ini.</p>

    <form action="konfirmasi_cod.html">

        <label>Nama Lengkap</label>
        <input type="text" required>

        <label>Alamat Lengkap</label>
        <textarea rows="4" required></textarea>

        <label>No. HP</label>
        <input type="tel" required>

        <button type="submit" class="btn-pesan">
            Pesan Sekarang
        </button>

    </form>

    <button type="button" class="btn-kembali" onclick="history.back()">
        ← Kembali
    </button>

</div>

</body>
</html>
