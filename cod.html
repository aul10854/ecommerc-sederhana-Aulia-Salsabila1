<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pembayaran COD</title>
</head>
<body>

    <h2>Bayar di Tempat (COD)</h2>

    <p>Silakan siapkan uang sesuai total belanja.</p>
    <p>Pembayaran dilakukan saat pesanan diterima.</p>

    <h3>Data Penerima</h3>

    <form>
        <label>Nama:</label><br>
        <input type="text" required><br><br>

        <label>Alamat:</label><br>
        <textarea rows="4" cols="30" required></textarea><br><br>

        <label>No. HP:</label><br>
        <input type="tel" required><br><br>

        <button type="submit">Pesan Sekarang</button>
    </form>

    <br>

    <button>Kembali ke Beranda</button>

</a>

</body>
</html>
