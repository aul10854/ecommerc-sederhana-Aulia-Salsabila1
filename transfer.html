<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Transfer Bank</title>

<style>
body{
    margin:0;
    background:linear-gradient(135deg,#ffb6d5,#ff69b4);
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    width:650px;
    padding:50px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    text-align:center;
    transition:0.3s;
}

.box:hover{
    transform:translateY(-5px);
    box-shadow:0 20px 45px rgba(0,0,0,0.25);
}

h2{
    color:#d63384;
    font-size:38px;
    margin-bottom:30px;
}

p{
    font-size:24px;
    line-height:1.8;
    color:#444;
}

b{
    color:#d63384;
}

button{
    background:linear-gradient(135deg,#ff4da6,#ff1493);
    color:white;
    border:none;
    padding:18px 40px;
    border-radius:15px;
    cursor:pointer;
    margin:15px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
    box-shadow:0 8px 18px rgba(255,20,147,0.3);
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 12px 25px rgba(255,20,147,0.4);
}

button:active{
    transform:scale(0.95);
}
</style>

</head>
<body>

<div class="box">

<h2>🏦 Pembayaran Transfer Bank</h2>

<p><b>Bank:</b> BCA</p>
<p><b>No. Rekening:</b> 1234567890</p>
<p><b>Atas Nama:</b> Bila Store</p>

<p>Silakan transfer sesuai total belanja Anda.</p>
<p>Setelah transfer berhasil, klik tombol di bawah.</p>

<a href="konfirmasi_pembayaran.html">
    <button>Saya Sudah Transfer</button>
</a>

<button onclick="history.back()">← Kembali</button>

</div>

</body>
</html>
