<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kontak - Bila Store</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffb6d5, #ff69b4);
    }

    nav {
        background: #6A0DAD;
        padding: 15px;
        text-align: center;
    }

    nav a {
        color: white;
        margin: 10px 15px;
        text-decoration: none;
        font-weight: bold;
    }

    nav a:hover {
        color: yellow;
    }

    .container {
        max-width: 750px;
        margin: 40px auto;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #d63384;
        margin-bottom: 10px;
    }

    p {
        text-align: center;
        color: #555;
    }

    .info {
        background: #ffe4f1;
        padding: 15px;
        margin-bottom: 12px;
        border-radius: 10px;
        color: #333;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
    }

    input, textarea {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
    }

    button {
        padding: 12px;
        background: linear-gradient(135deg, #ff4da6, #ff1493);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s ease;
    }

    button:hover {
        transform: scale(1.03);
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: #777;
    }
</style>
</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="produk.html">Produk</a>
    <a href="tambah keranjang.html">Keranjang</a>
    <a href="business overview.html">Business Overview</a>
    <a href="kontak.html">Kontak</a>
</nav>

<div class="container">

    <h1>Kontak Bila Store</h1>
    <p>Hubungi kami jika ada pertanyaan atau pemesanan</p>

    <div class="info">📍 Alamat: Jl. Barunagri No. 72, Indonesia</div>
    <div class="info">📞 WhatsApp: +62 83829876694</div>
    <div class="info">📧 Email: bilastore@email.com</div>
    <div class="info">⏰ Jam Operasional: 08.00 - 21.00 WIB</div>

   <form onsubmit="kirimPesan(event)">
    <input type="text" placeholder="Nama" required>
    <input type="email" placeholder="Email" required>
    <textarea rows="4" placeholder="Pertanyaan" required></textarea>
    <button type="submit">Kirim Pesan</button>

    <p id="pesan" style="margin-top:10px; color:green; font-weight:bold;"></p>
</form>
   

    <div class="footer">
        © 2026 Bila Store. All Rights Reserved.
    </div>

</div>
<script>
function kirimPesan(event) {
    event.preventDefault();

    document.getElementById("pesan").innerText =
        "✅ Pertanyaan berhasil diterima, terima kasih!";
}
</script>
</body>
</html>
