<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Konfirmasi Pembayaran</title>

<style>
    body {
        background: linear-gradient(135deg, #ffb6d5, #ff69b4);
        font-family: Arial, sans-serif;
        height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        background: white;
        text-align: center;
        padding: 50px;
        border-radius: 20px;
        width: 420px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        transition: 0.3s ease;
    }

    .box:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    }

    h2 {
        color: #d63384;
        font-size: 28px;
        margin-bottom: 15px;
    }

    p {
        font-size: 16px;
        margin: 8px 0;
    }

    button {
        margin-top: 20px;
        padding: 12px 26px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(135deg, #ff4da6, #ff1493);
        color: white;
        font-size: 16px;
        box-shadow: 0 8px 18px rgba(255,20,147,0.3);
        transition: 0.2s ease;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 12px 25px rgba(255,20,147,0.4);
    }

    button:active {
        transform: scale(0.95);
    }

    .success {
        font-size: 40px;
        margin-bottom: 10px;
    }
</style>
</head>

<body>

<div class="box">

    <div class="success">✔️</div>

    <h2>Pembayaran Berhasil</h2>

    <p>Terima kasih telah berbelanja di Bila Store.</p>
    <p>Pesanan Anda sedang diproses.</p>

    <a href="index.html">
        <button>Kembali ke Home</button>
    </a>

</div>

</body>
</html>
