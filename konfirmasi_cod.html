<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Konfirmasi Pesanan COD</title>

<style>
    body {
        background: linear-gradient(135deg, #ffb6d5, #ff69b4);
        font-family: Arial, sans-serif;
        height: 100vh;
        margin: 0;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        background: white;
        text-align: center;
        padding: 50px 40px;
        border-radius: 22px;
        width: 450px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);

        animation: fadeIn 0.5s ease;
        transition: 0.3s ease;
    }

    .box:hover {
        transform: translateY(-6px);
        box-shadow: 0 25px 55px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    h2 {
        color: #d63384;
        font-size: 28px;
        margin-bottom: 15px;
    }

    p {
        font-size: 16px;
        margin: 8px 0;
        color: #444;
        line-height: 1.5;
    }

    .icon {
        font-size: 50px;
        margin-bottom: 10px;
        animation: pop 0.6s ease;
    }

    @keyframes pop {
        0% { transform: scale(0); }
        80% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    button {
        margin-top: 20px;
        padding: 12px 28px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        background: linear-gradient(135deg, #6A0DAD, #4B0082);
        color: white;
        font-size: 16px;
        box-shadow: 0 10px 20px rgba(75,0,130,0.3);
        transition: 0.2s ease;
    }

    button:hover {
        transform: scale(1.06);
        box-shadow: 0 14px 28px rgba(75,0,130,0.4);
    }

    button:active {
        transform: scale(0.95);
    }
</style>
</head>

<body>

<div class="box">

    <div class="icon">📦</div>

    <h2>Pesanan Berhasil Dibuat</h2>

    <p>Terima kasih telah berbelanja di Bila Store.</p>

    <p>Pesanan Anda sedang diproses.</p>

    <p>
        Silakan lakukan pembayaran kepada kurir saat pesanan diterima (COD).
    </p>

    <a href="index.html">
        <button>Kembali ke Home</button>
    </a>

</div>

</body>
</html>
