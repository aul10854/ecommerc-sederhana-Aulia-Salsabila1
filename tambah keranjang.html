<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang Belanja</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#FFC0CB;
    margin:0;
}

nav{
    background:#6A0DAD;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

h2{
    text-align:center;
    color:#6A0DAD;
    margin-top:30px;
}

table{
    width:80%;
    margin:20px auto;
    border-collapse:collapse;
    background:white;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#6A0DAD;
    color:white;
}

button{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:darkred;
}

.total{
    width:80%;
    margin:auto;
    text-align:right;
    font-size:22px;
    font-weight:bold;
    color:#6A0DAD;
}

.checkout{
    display:block;
    width:200px;
    margin:30px auto;
    text-align:center;
    background:#6A0DAD;
    color:white;
    padding:15px;
    text-decoration:none;
    border-radius:10px;
}
</style>

</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="produk.html">Produk</a>
    <a href="tambah keranjang.html">Keranjang</a>
</nav>

<h2>🛒 Keranjang Belanja</h2>

<table>

<thead>

<tr>
<th>Produk</th>
<th>Harga</th>
<th>Jumlah</th>
<th>Subtotal</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="isiKeranjang">

</tbody>

</table>

<div class="total" id="totalHarga">
Total : Rp0
</div>

<a href="via pembayaran.html" class="checkout">
Lanjut Pembayaran
</a>

<script>

let keranjang = JSON.parse(localStorage.getItem("keranjang")) || [];

function tampilKeranjang(){

let isi=document.getElementById("isiKeranjang");

isi.innerHTML="";

let total=0;

keranjang.forEach((produk,index)=>{

let subtotal=produk.harga*produk.jumlah;

total+=subtotal;

isi.innerHTML+=`

<tr>

<td>${produk.nama}</td>

<td>Rp ${produk.harga.toLocaleString()}</td>
<td>
<button onclick="kurangProduk(${index})">➖</button>

${produk.jumlah}

<button onclick="tambahProduk(${index})">➕</button>
</td>


<td>Rp ${subtotal.toLocaleString()}</td>

<td>

<button onclick="hapusProduk(${index})">

Hapus

</button>

</td>

</tr>

`;

});

document.getElementById("totalHarga").innerHTML="Total : Rp "+total.toLocaleString();
}

function tambahProduk(index){

    keranjang[index].jumlah++;
    localStorage.setItem("keranjang", JSON.stringify(keranjang));


    tampilKeranjang();

}

function kurangProduk(index){

    if(keranjang[index].jumlah > 1){
        keranjang[index].jumlah--;
    }

    localStorage.setItem("keranjang", JSON.stringify(keranjang));

    tampilKeranjang();

}

function hapusProduk(index){

    keranjang.splice(index,1);

    localStorage.setItem("keranjang", JSON.stringify(keranjang));

    tampilKeranjang();

}

tampilKeranjang();

</script>

</body>
</html>
</html>
